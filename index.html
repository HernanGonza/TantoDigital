<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanto Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="estilos.css" />
  <link rel="shortcut icon" href="Imagenes/favicon.ico" type="image/x-icon">
</head>
<body>

  <div class="form-container text-center">

    <!-- LOGO -->
    <img src="Imagenes/Logo con fondo transparente.png" alt="Tanto Digital" class="logo mb-3">

    <!-- Texto de construcción -->
    <p class="construction-text">Sitio en construcción</p>

    <h2 class="text-center mb-4">Contacto</h2>

    <!-- FORMULARIO -->
    <form id="contactForm">
      <div class="mb-3 text-start">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" required />
      </div>
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="mb-3 text-start">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea class="form-control" id="mensaje" rows="5" required></textarea>
      </div>

      <!-- Botón y Loader -->
      <div class="d-flex align-items-center justify-content-center gap-3">
        <button type="submit" class="btn btn-dark w-50">Enviar</button>
        <div id="loader" class="loader d-none"></div>
      </div>
    </form>

    <!-- Mensaje de éxito -->
    <div id="successMessage" class="alert alert-success success-message text-center">
      ¡Mensaje enviado con éxito!
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
