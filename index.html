<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contacto | Tanto Digital</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f7f7f7;
      padding: 20px;
    }

    .form-container {
      max-width: 500px;
      margin: auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
    }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #000;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Contacto</h2>

    <form action="https://formsubmit.co/contacto@tanto.digital" method="POST">

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Tu email" required>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" placeholder="Tu mensaje" required rows="5"></textarea>

      <!-- Campo honeypot antispam -->
      <input type="text" name="_honey" style="display:none">

      <!-- Redirección luego del envío -->
      <input type="hidden" name="_next" value="https://tanto.digital/gracias.html">

      <!-- reCAPTCHA invisible activado por defecto (no desactivamos) -->

      <button type="submit">Enviar</button>
    </form>
  </div>

</body>
</html>
