<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanto Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="estilos.css" />
  <link rel="shortcut icon" href="Imagenes/favicon.ico" type="image/x-icon">
</head>
<body>

  <div class="text-center">
    <!-- LOGO -->
    <img src="Imagenes/Logo con fondo transparente.png" alt="Tanto Digital" class="logo mb-3" />

    <!-- Texto de construcción -->
    <p class="construction-text">Estamos contruyendo nuestro sitio.....toma tiempo</p>

    <!-- Botón para abrir el formulario -->
    <button class="shadow__btn" id="openContactBtn" data-bs-toggle="modal" data-bs-target="#contactModal">
      Tocá acá para hablar con nosotros
    </button>
  </div>

  <!-- MODAL FORMULARIO -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content position-relative">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="contactModalLabel">Contacto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="contactForm">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control glow-input" id="nombre" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control glow-input" id="email" required />
            </div>
            <div class="mb-3">
              <label for="mensaje" class="form-label">Mensaje</label>
              <textarea class="form-control glow-input" id="mensaje" rows="5" required></textarea>
            </div>
            <button type="submit" class="shadow__btn-submit">Enviar</button>
          </form>

          <!-- Loader -->
          <div id="loaderOverlay" class="loader-overlay d-none">
            <div class="loader"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DE ÉXITO -->
  <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center">
        <div class="modal-body">
          <h5 class="modal-title" id="successModalLabel">Gracias por escribirnos, pronto nos pondremos en contacto.</h5>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
