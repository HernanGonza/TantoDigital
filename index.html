<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanto Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="estilos.css" />
  <link rel="shortcut icon" href="Imagenes/favicon.ico" type="image/x-icon">
</head>
<body>

  <div class="form-container text-center position-relative">

    <!-- LOGO -->
    <img src="Imagenes/Logo con fondo transparente.png" alt="Tanto Digital" class="logo mb-3">

    <!-- Texto de construcción -->
    <p class="construction-text">Sitio en construcción</p>

    <h2 class="text-center mb-4">Contacto</h2>

    <!-- FORMULARIO -->
    <form id="contactForm">
      <div class="mb-3 text-start">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" required />
      </div>
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="mb-3 text-start">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea class="form-control" id="mensaje" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn btn-dark w-100">Enviar</button>
    </form>

    <!-- LOADER CENTRAL -->
    <div id="loaderOverlay" class="loader-overlay d-none">
      <div class="loader"></div>
    </div>

  </div>

  <!-- MODAL DE ÉXITO -->
  <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center">
        <div class="modal-body">
          <h5 class="modal-title" id="successModalLabel">¡Mensaje enviado con éxito!</h5>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
