<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación Logo Tanto Digital</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            overflow: hidden;
        }

        #logo-container {
            position: relative;
            width: 400px;
            height: 100px;
        }

        .logo-part {
            position: absolute;
            /* La opacidad inicial ahora la controla mo.js, no el CSS */
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <svg id="iso" class="logo-part" width="60" height="60" style="left: 0; top: 0;" viewBox="0 0 100 100">
            <path fill="#00AEEF" d="M45,0 H55 V45 H100 V55 H55 V100 H45 V55 H0 V45 H45 Z"/>
        </svg>

        <svg id="t1" class="logo-part" width="30" height="40" style="left: 80px; top: 10px;" viewBox="0 0 30 40"><path fill="#333" d="M0 0h30v8H19v32h-8V8H0z"/></svg>
        <svg id="a1" class="logo-part" width="30" height="40" style="left: 115px; top: 10px;" viewBox="0 0 30 40"><path fill="#333" d="M15 0L0 40h8l3-8h8l3 8h8L15 0zm-3 24l3-8 3 8h-6z"/></svg>
        <svg id="n" class="logo-part" width="30" height="40" style="left: 150px; top: 10px;" viewBox="0 0 30 40"><path fill="#333" d="M0 40V0h8v18l14-18h8v40h-8V22L8 40H0z"/></svg>
        <svg id="t2" class="logo-part" width="30" height="40" style="left: 185px; top: 10px;" viewBox="0 0 30 40"><path fill="#333" d="M0 0h30v8H19v32h-8V8H0z"/></svg>
        <svg id="o" class="logo-part" width="30" height="40" style="left: 220px; top: 10px;" viewBox="0 0 30 40"><path fill="#333" d="M15 0C6.7 0 0 9 0 20s6.7 20 15 20 15-9 15-20S23.3 0 15 0zm0 32c-4.4 0-8-5.4-8-12s3.6-12 8-12 8 5.4 8 12-3.6 12-8 12z"/></svg>

        <svg id="d" class="logo-part" width="30" height="40" style="left: 80px; top: 50px;" viewBox="0 0 30 40"><path fill="#555" d="M15 0C6.7 0 0 9 0 20v20h8V20c0-6.6 3.1-12 7-12s7 5.4 7 12v20h8V20C30 9 23.3 0 15 0z"/></svg>
        <svg id="i1" class="logo-part" width="10" height="40" style="left: 120px; top: 50px;" viewBox="0 0 10 40"><path fill="#555" d="M0 10h10v30H0z M5 0a5 5 0 110 10 5 5 0 010-10z"/></svg>
        <svg id="g" class="logo-part" width="30" height="40" style="left: 135px; top: 50px;" viewBox="0 0 30 40"><path fill="#555" d="M15 0C6.7 0 0 9 0 20s6.7 20 15 20c8.3 0 15-9 15-20S23.3 0 15 0zm0 32c-4.4 0-8-5.4-8-12s3.6-12 8-12 8 5.4 8 12-3.6 12-8 12z M20 20h-8v-8h8v-4h-12v20h12z"/></svg>
        <svg id="i2" class="logo-part" width="10" height="40" style="left: 175px; top: 50px;" viewBox="0 0 10 40"><path fill="#555" d="M0 10h10v30H0z M5 0a5 5 0 110 10 5 5 0 010-10z"/></svg>
        <svg id="t3" class="logo-part" width="30" height="40" style="left: 190px; top: 50px;" viewBox="0 0 30 40"><path fill="#333" d="M0 0h30v8H19v32h-8V8H0z"/></svg>
        <svg id="a2" class="logo-part" width="30" height="40" style="left: 225px; top: 50px;" viewBox="0 0 30 40"><path fill="#333" d="M15 0L0 40h8l3-8h8l3 8h8L15 0zm-3 24l3-8 3 8h-6z"/></svg>
        <svg id="l" class="logo-part" width="30" height="40" style="left: 260px; top: 50px;" viewBox="0 0 30 40"><path fill="#333" d="M0 0h8v32h14v8H0z"/></svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mojs/core"></script>

    <script>
    // --- JavaScript Modificado ---

    // 1. Aumentamos la duración y definimos una curva de aceleración más suave
    const DURATION = 1800; // Antes era 800ms, ahora es casi 2 segundos
    const EASING = 'cubic.out'; // 'cubic.out' es una curva muy suave y profesional

    const timeline = new mojs.Timeline();

    // Animación del Isotipo (ahora usa las nuevas constantes)
    const isoAnimation = new mojs.Html({
        el: '#iso',
        opacity: { 0: 1 },
        scale: { 0: 1 },
        duration: 1200, // Hacemos que el iso aparezca un poco más rápido
        easing: 'elastic.out', // Mantenemos el rebote elástico que le da carácter
    });

    // Animaciones de las letras (usando la nueva duración, easing y delays más espaciados)
    const t1_in = new mojs.Html({
        el: '#t1', opacity: { 0: 1 }, x: { '-100': 0 }, y: { '-100': 0 }, duration: DURATION, easing: EASING
    });
    const a1_in = new mojs.Html({
        el: '#a1', opacity: { 0: 1 }, y: { '100': 0 }, duration: DURATION, delay: 100, easing: EASING
    });
    const n_in = new mojs.Html({
        el: '#n', opacity: { 0: 1 }, y: { '-100': 0 }, duration: DURATION, delay: 150, easing: EASING
    });
    const t2_in = new mojs.Html({
        el: '#t2', opacity: { 0: 1 }, y: { '100': 0 }, x: { '100': 0 }, duration: DURATION, delay: 200, easing: EASING
    });
    const o_in = new mojs.Html({
        el: '#o', opacity: { 0: 1 }, x: { '150': 0 }, angle: {'-360':0}, duration: DURATION, delay: 250, easing: EASING
    });

    // Damos un mayor retraso al inicio de "digital" para separar las dos palabras
    const digital_delay_start = 400;

    const d_in = new mojs.Html({
        el: '#d', opacity: { 0: 1 }, x: { '-100': 0 }, duration: DURATION, delay: digital_delay_start, easing: EASING
    });
    const i1_in = new mojs.Html({
        el: '#i1', opacity: { 0: 1 }, y: { '-100': 0 }, duration: DURATION, delay: digital_delay_start + 50, easing: EASING
    });
    const g_in = new mojs.Html({
        el: '#g', opacity: { 0: 1 }, x: { '100': 0 }, y: {'100':0}, duration: DURATION, delay: digital_delay_start + 100, easing: EASING
    });
    const i2_in = new mojs.Html({
        el: '#i2', opacity: { 0: 1 }, y: { '-100': 0 }, duration: DURATION, delay: digital_delay_start + 150, easing: EASING
    });
    const t3_in = new mojs.Html({
        el: '#t3', opacity: { 0: 1 }, x: { '-100': 0 }, duration: DURATION, delay: digital_delay_start + 200, easing: EASING
    });
    const a2_in = new mojs.Html({
        el: '#a2', opacity: { 0: 1 }, y: { '100': 0 }, duration: DURATION, delay: digital_delay_start + 250, easing: EASING
    });
    const l_in = new mojs.Html({
        el: '#l', opacity: { 0: 1 }, x: { '100': 0 }, duration: DURATION, delay: digital_delay_start + 300, easing: EASING
    });

    // Efecto de "explosión"
    const burst = new mojs.Burst({
        parent: '#iso',
        radius: { 20: 70 },
        count: 8,
        duration: 1200,
        delay: 400, // Retrasamos el inicio del burst
        children: {
            fill: '#00AEEF',
            shape: 'circle',
            opacity: { 0.6: 0 },
            scale: { 1: 0 },
            easing: 'cubic.out'
        }
    });

    // Añadir todo a la línea de tiempo
    timeline.add(
        isoAnimation,
        t1_in, a1_in, n_in, t2_in, o_in,
        d_in, i1_in, g_in, i2_in, t3_in, a2_in, l_in,
        burst
    );

    // Repetir al hacer clic
    document.addEventListener('click', function() {
        timeline.replay();
    });

    // Iniciar la animación al cargar la página
    timeline.play();
</script>
</body>
</html>
